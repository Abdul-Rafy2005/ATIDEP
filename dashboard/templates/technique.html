{% extends "base.html" %}
{% block title %}ATIDEP - Technique {{ technique_id }}{% endblock %}
{% block content %}
<div id="tech-content">
    <div class="card p-8 text-center text-slate-400">Loading technique {{ technique_id }}...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const TECHNIQUE_ID = '{{ technique_id }}';
const verdictClass = {
    'PASS': 'verdict-pass', 'TOO_NARROW': 'verdict-narrow',
    'NOISY': 'verdict-noisy', 'MISSED_SHOWN': 'verdict-missed',
    'SYNTAX_ERROR': 'verdict-syntax', 'NOT_TESTED': 'verdict-not-tested'
};

async function loadTechnique() {
    const res = await fetch(`/api/technique/${TECHNIQUE_ID}`);
    if (!res.ok) {
        document.getElementById('tech-content').innerHTML = '<div class="card p-8 text-center text-red-400">Technique not found</div>';
        return;
    }
    const tech = await res.json();
    const container = document.getElementById('tech-content');

    let html = `
        <div class="mb-6">
            <a href="/coverage" class="text-xs text-blue-400 hover:text-blue-300 font-medium">&larr; Back to Coverage Map</a>
            <div class="flex flex-wrap items-center justify-between gap-4 mt-2">
                <div>
                    <h2 class="text-2xl font-bold text-white font-mono">${tech.id}</h2>
                    <p class="text-base text-slate-300">${tech.title || 'Untitled Technique'}</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${verdictClass[tech.best_verdict]}">
                        Best Verdict: ${tech.best_verdict}
                    </span>
                </div>
            </div>
            <div class="flex flex-wrap gap-4 text-xs text-slate-400 mt-3">
                <div><span class="text-slate-500">Tactics:</span> <span class="text-slate-300">${tech.tactics.join(', ')}</span></div>
                <div><span class="text-slate-500">Test Sets:</span> <span class="text-slate-300">${tech.sets.map(s => 'Set ' + s).join(', ')}</span></div>
                <div><span class="text-slate-500">Ref Status:</span> <span class="text-slate-300 font-mono">${tech.ref_status || 'N/A'}</span></div>
            </div>
        </div>
    `;

    // Test events
    if (tech.events && Object.keys(tech.events).length > 0) {
        for (const [setNum, ev] of Object.entries(tech.events)) {
            html += `
                <div class="card p-5 mb-5">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                        <h3 class="text-sm font-semibold text-white">Validation Log Events (Set ${setNum})</h3>
                        <span class="text-xs text-slate-500">Sysmon Event 1 process_creation</span>
                    </div>
                    <div class="space-y-3 text-xs font-mono">
                        <div class="bg-slate-900/80 p-3 rounded border border-slate-800">
                            <div class="text-red-400 font-semibold mb-1">&#9656; Malicious Shown Attack Line:</div>
                            <div class="text-slate-300 break-all select-all">${ev.shown || 'N/A'}</div>
                        </div>
                        <div class="bg-slate-900/80 p-3 rounded border border-slate-800">
                            <div class="text-orange-400 font-semibold mb-1">&#9656; Hidden Attack Variant Line:</div>
                            <div class="text-slate-300 break-all select-all">${ev.variant || 'N/A'}</div>
                        </div>
                        <div class="bg-slate-900/80 p-3 rounded border border-slate-800">
                            <div class="text-green-400 font-semibold mb-1">&#9656; Harmless Near-Miss Line:</div>
                            <div class="text-slate-300 break-all select-all">${ev.benign || 'N/A'}</div>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    // Results table
    const configs = Object.values(tech.configs || {});
    if (configs.length > 0) {
        configs.sort((a, b) => {
            if (a.set !== b.set) return a.set - b.set;
            if (a.model !== b.model) return a.model.localeCompare(b.model);
            if (a.prompt !== b.prompt) return a.prompt.localeCompare(b.prompt);
            return a.repeat - b.repeat;
        });

        html += `
            <div class="card p-5 mb-5">
                <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                    <h3 class="text-sm font-semibold text-white">Rule Generation Evaluations (${configs.length} runs recorded)</h3>
                    <span class="text-xs text-slate-500">Click "View Rule" to inspect generated YAML</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs">
                        <thead>
                            <tr class="text-slate-400 border-b border-slate-700 bg-slate-900/50">
                                <th class="text-left py-2.5 px-3">Model</th>
                                <th class="text-left py-2.5 px-3">Prompt</th>
                                <th class="text-left py-2.5 px-3">Set</th>
                                <th class="text-left py-2.5 px-3">Repeat</th>
                                <th class="text-left py-2.5 px-3">Strict Pass</th>
                                <th class="text-left py-2.5 px-3">Verdict</th>
                                <th class="text-left py-2.5 px-3">Action</th>
                            </tr>
                        </thead>
                        <tbody>
        `;
        configs.forEach(c => {
            html += `
                <tr class="border-b border-slate-800 hover:bg-slate-800/40 font-mono">
                    <td class="py-2.5 px-3 text-slate-300">${c.model}</td>
                    <td class="py-2.5 px-3 text-blue-300">${c.prompt}</td>
                    <td class="py-2.5 px-3">${c.set}</td>
                    <td class="py-2.5 px-3">${c.repeat}</td>
                    <td class="py-2.5 px-3 font-semibold ${c.strict_pass ? 'text-green-400' : 'text-slate-600'}">${c.strict_pass ? 'YES' : 'NO'}</td>
                    <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[11px] font-medium ${verdictClass[c.verdict]}">${c.verdict}</span></td>
                    <td class="py-2.5 px-3">
                        <button onclick="loadRule('${c.run_folder}', '${c.model}', '${TECHNIQUE_ID}', ${c.repeat})" class="text-blue-400 hover:text-blue-300 font-sans hover:underline">
                            View Rule &rarr;
                        </button>
                    </td>
                </tr>
            `;
        });
        html += '</tbody></table></div></div>';
    }

    // Rule display area
    html += `
        <div id="rule-display" class="card p-5 hidden">
            <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                <h3 class="text-sm font-semibold text-white">Generated Sigma Rule YAML</h3>
                <span id="rule-meta" class="text-xs font-mono text-slate-500"></span>
            </div>
            <pre id="rule-text" class="text-xs text-slate-300 bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono overflow-x-auto select-all leading-relaxed"></pre>
        </div>
    `;

    container.innerHTML = html;
}

async function loadRule(folder, model, technique, repeat) {
    const res = await fetch(`/api/rule/${folder}/${encodeURIComponent(model)}/${technique}/${repeat}`);
    const display = document.getElementById('rule-display');
    const text = document.getElementById('rule-text');
    const meta = document.getElementById('rule-meta');
    if (res.ok) {
        const data = await res.json();
        text.textContent = data.rule_text;
        meta.textContent = `${model} | ${technique} | r${repeat}`;
        display.classList.remove('hidden');
        display.scrollIntoView({ behavior: 'smooth' });
    } else {
        alert('Rule file not found for this execution.');
    }
}

document.addEventListener('DOMContentLoaded', loadTechnique);
</script>
{% endblock %}
