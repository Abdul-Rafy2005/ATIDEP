title: Registry Entry Added With Reg.exe
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
            - '/v Updater'
            - '/d C:\Users\student\x.exe'
    condition: all of selection_*
level: high
tags:
    - attack.persistence
    - attack.t1560.001
