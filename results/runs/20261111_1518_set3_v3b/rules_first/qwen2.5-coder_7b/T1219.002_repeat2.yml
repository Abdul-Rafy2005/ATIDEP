title: Amazon SSM Agent Registration
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\amazon-ssm-agent.exe'
        CommandLine|contains|windash|all:
            - '-register'
            - '-code'
            - '-id'
            - '-region'
    condition: selection
level: high
tags:
