title: Certutil Downloads File From Internet
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_cli:
        CommandLine|contains|all:
            - windash: '-urlcache'
            - windash: '-f'
            - 'http://'
    condition: all of selection_*
level: medium
tags:
    - attack.execution
    - attack.t1105