title: Certutil Downloads File From Internet
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|windash: '-urlcache'
        CommandLine|contains|windash: '-f'
        CommandLine|contains|all:
            - 'http://'
            - '.exe'
    condition: selection
level: medium
tags:
    - attack.execution
    - attack.t1105