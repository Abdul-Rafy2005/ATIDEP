title: PowerShell Downloads and Executes Script
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|windash|all:
            - '-nop'
            - '-w hidden'
            - '-c'
            - 'IEX'
            - 'DownloadString'
    condition: selection
level: high
tags:
    - attack.execution
    - attack.t1059.001