title: Executable Dropped in Startup Folder
status: test
logsource:
    category: file_event
    product: windows
detection:
    selection_ext:
        TargetFilename|endswith: '.exe'
    selection_path:
        TargetFilename|contains: '\Startup\'
    condition: all of selection_*
level: high
tags:
    - attack.persistence
    - attack.t1547.001