title: BITSAdmin Used to Download DLL from Remote Server
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains|all: 
            - '/transfer'
            - '/download'
            - 'http://'
            - '.dll'
    condition: selection
level: high
tags:
    - attack.execution
    - attack.t1197