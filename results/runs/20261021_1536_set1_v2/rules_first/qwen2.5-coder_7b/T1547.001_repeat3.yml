title: Registry Entry Added for Persistence
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\reg.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
            - '/v'
            - '/d'
    condition: all of selection_*
level: high
tags:
    - attack.persistence
    - attack.t1547.001