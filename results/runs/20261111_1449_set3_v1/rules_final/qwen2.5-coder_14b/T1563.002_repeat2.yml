title: Remote Desktop Session Shadowing Without Consent
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mstsc.exe'
        CommandLine|contains|all: 
            - ' /v:'
            - ' /shadow:'
            - ' /noconsentprompt'
    condition: selection
level: high
tags:
    - attack.credential-access
    - attack.t1563.002