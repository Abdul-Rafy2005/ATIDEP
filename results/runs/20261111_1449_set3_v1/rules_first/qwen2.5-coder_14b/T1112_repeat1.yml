title: Arbitrary Driver Installation via VirtualBox Driver Installer
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\VBoxDrvInst.exe'
        CommandLine|contains|all: 
            - 'driver'
            - 'executeinf'
    condition: selection
level: high
tags:
    - attack.persistence
    - attack.t1112