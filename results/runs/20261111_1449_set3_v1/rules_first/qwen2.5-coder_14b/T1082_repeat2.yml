title: Live Kernel Memory Dump Using DTrace
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\dtrace.exe'
        CommandLine|contains|all: 
            - ' -w '
            - ' -n "BEGIN { lkd(0); }"'
    condition: selection
level: high
tags:
    - attack.exfiltration
    - attack.t1082