title: Firefox Launched With Remote Debugging Server Enabled
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\firefox.exe'
        CommandLine|contains|windash: '-start-debugger-server'
    condition: selection
level: high
tags:
