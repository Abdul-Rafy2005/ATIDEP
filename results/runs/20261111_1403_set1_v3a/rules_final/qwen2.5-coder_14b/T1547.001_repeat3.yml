title: Registry Key Modification for Run
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains|windash|all:
            - 'add'
            - 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'
            - '/v'
    condition: selection
level: medium
tags:
    - attack.persistence
    - attack.t1547.001