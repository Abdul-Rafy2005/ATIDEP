title: Procdump Used To Dump LSASS Memory
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\procdump.exe'
        CommandLine|contains|windash|all:
            - '-ma'
            - 'lsass.exe'
    condition: selection
level: high
tags:
    - attack.privilege-escalation
    - attack.t1003.001