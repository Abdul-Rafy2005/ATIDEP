title: Dump Lsass Memory Using ProcDump
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\procdump.exe'
    selection_cli:
        CommandLine|contains|all:
            - windash: '-ma'
            - 'lsass.exe'
    condition: all of selection_*
level: high
tags:
    - attack.credential_access
    - attack.t1003.001