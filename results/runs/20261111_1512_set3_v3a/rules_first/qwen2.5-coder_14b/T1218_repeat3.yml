title: Dsacls Used To Test Domain Account Password
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\dsacls.exe'
        CommandLine|contains|windash|all:
            - '/user:'
            - '/passwd:'
    condition: selection
level: high
tags:
    - attack.credential-access
    - attack.t1218