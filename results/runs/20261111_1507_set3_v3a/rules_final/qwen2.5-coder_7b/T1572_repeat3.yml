title: OpenSSH Used For Reverse Port Forwarding
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ssh.exe'
        CommandLine|contains|windash|all:
            - '-R'
            - 'localhost:'
    condition: selection
level: high
tags:
