title: DTrace Used To Dump Live Kernel Memory
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\dtrace.exe'
        CommandLine|contains|windash|all:
            - '-w'
            - '-n'
            - 'BEGIN { lkd(0); }'
    condition: selection
level: high
tags:
    - attack.persistence
    - attack.t1082