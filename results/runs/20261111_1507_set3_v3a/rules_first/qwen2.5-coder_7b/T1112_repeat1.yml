title: VirtualBox Driver Installer Executes INF File
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\VBoxDrvInst.exe'
        CommandLine|contains|all:
            - 'driver'
            - 'executeinf'
    condition: selection
level: high
tags:
    - attack.privilege-escalation
    - attack.t1112