title: BITSAdmin Downloads DLL From Remote Server
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\bitsadmin.exe'
    selection_cli:
        CommandLine|contains|all:
            - '/transfer'
            - '/download'
            - '.dll'
    condition: all of selection_*
level: medium
tags:
    - attack.execution
    - attack.t1197