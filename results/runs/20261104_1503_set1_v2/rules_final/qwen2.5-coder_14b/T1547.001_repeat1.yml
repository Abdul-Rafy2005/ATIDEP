title: Registry Key Modified to Add Program to Run
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'add'
            - 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'
            - '/v'
    condition: all of selection_*
level: high
tags:
    - attack.persistence
    - attack.t1547.001