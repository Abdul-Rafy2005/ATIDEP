title: PowerShell Downloads and Executes Script
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains|all:
            - '-nop'
            - '-w hidden'
            - 'IEX (New-Object Net.WebClient).DownloadString('
    condition: all of selection_*
level: high
tags:
    - attack.execution
    - attack.t1059.001