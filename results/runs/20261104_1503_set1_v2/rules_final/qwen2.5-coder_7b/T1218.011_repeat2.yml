title: Suspicious Rundll32 Execution with .sys File
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_cli:
        CommandLine|contains|all:
            - '\Windows\Temp\'
            - '.sys,'
    condition: all of selection_*
level: high
tags:
    - attack.execution
    - attack.t1218.011