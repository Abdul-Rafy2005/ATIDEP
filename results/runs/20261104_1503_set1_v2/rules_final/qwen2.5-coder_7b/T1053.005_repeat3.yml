title: Scheduled Task Created to Run Program from Temp Folder
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_cli:
        CommandLine|contains|all:
            - '\Temp\'
            - '.exe'
    condition: all of selection_*
level: high
tags:
    - attack.persistence
    - attack.t1053.005