title: Inline JavaScript Execution With Mshta
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\mshta.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'javascript:'
            - 'GetObject('
            - '.Exec();'
    condition: all of selection_*
level: high
tags:
    - attack.execution
    - attack.t1218.005