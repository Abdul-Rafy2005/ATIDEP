title: Regsvr32 Loads Remote Script Over HTTP
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\regsvr32.exe'
    selection_cli:
        CommandLine|contains|all:
            - windash: '-s'
            - windash: '-u'
            - windash: '-i:http'
    condition: all of selection_*
level: high
tags:
    - attack.execution
    - attack.t1218.010