title: Scheduled Task Runs Program From Temp Folder
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|windash|all:
            - '/create'
            - '/tr'
            - '\Temp\'
    condition: selection
level: medium
tags:
    - attack.persistence
    - attack.t1053.005