title: Scheduled Task Created From Temp Folder
status: test
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_cli:
        CommandLine|contains|windash|all:
            - '/create'
            - '/tr'
            - '\AppData\Local\Temp\'
    condition: all of selection_*
level: medium
tags:
    - attack.execution
    - attack.t1053.005